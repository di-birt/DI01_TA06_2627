<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
     <!-- TODO: Modificar <ion-title>{{ elementoDetalle?.nombre }}</ion-title> -->
    <!-- Con signal, leemos el valor llamándolo como función: elementoDetalle() -->
    <ion-title>{{ elementoDetalle()?.nombre }}</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- TODO: Modificar elementoDetalle por elementoDetalle()-->
  <!-- @if evalúa el signal como función; dentro del bloque, elementoDetalle() ya tiene valor -->
  @if (elementoDetalle()) {
    <ion-list>
      <ion-item>
        <ion-label>
          <h2>{{ elementoDetalle()!.nombre | titlecase }}</h2>
          <p>{{ elementoDetalle()!.descripcion }}</p>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Categoría: {{ elementoDetalle()!.categoria | uppercase }}</ion-label>
      </ion-item>
    </ion-list>
  } @else {
    <ion-item>
      <ion-label>No se ha seleccionado ningún elemento.</ion-label>
    </ion-item>
  }

</ion-content>
